name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://edunomad:edunomad@localhost:5432/edunomad
  AUTH_SECRET: ci-insecure-secret-not-for-prod

jobs:
  build-test:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edunomad
          POSTGRES_PASSWORD: edunomad
          POSTGRES_DB: edunomad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunomad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare database
        run: |
          npx prisma db push --skip-generate
          node prisma/harden.mjs
          npm run db:seed
          node prisma/seed-catalog.mjs
          node prisma/seed-team.mjs
          node prisma/seed-ops.mjs
          node prisma/seed-sop.mjs
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npm test
      - name: Build
        run: NODE_ENV=production npm run build
      - name: Accessibility (WCAG 2.1 A/AA, blocking)
        # Blocking on purpose. The axe coverage below runs under Playwright in a
        # continue-on-error job over four public routes; a gate that cannot fail
        # is not a gate. This runs axe-core in jsdom against the real server
        # output — no browser download — across every public surface and the
        # authenticated consoles for six roles, and fails the build on any
        # serious or critical violation. Verified green on 52 routes before
        # being made blocking.
        run: |
          E2E_OTP_BYPASS=1 npm run start -- --port 3000 &
          for i in $(seq 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done
          node scripts/a11y-scan.mjs

  lighthouse:
    name: Lighthouse PWA + budgets
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edunomad
          POSTGRES_PASSWORD: edunomad
          POSTGRES_DB: edunomad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunomad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate && node prisma/harden.mjs && npm run db:seed
      - run: NODE_ENV=production npm run build
      - name: Run Lighthouse CI (PWA ≥ 90, budgets)
        # Advisory, and honestly so: Lighthouse scores on a shared CI runner move
        # with runner load, and a flaky gate teaches people to ignore red. What
        # this job protects is tracked elsewhere and blocking: server-side perf
        # budgets in perf.test.ts, and WCAG A/AA in the a11y step of build-test,
        # both in jobs that fail the build. This reports the deployed-staging
        # baseline that Lighthouse is actually good at.
        continue-on-error: true
        run: npm run lighthouse

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edunomad
          POSTGRES_PASSWORD: edunomad
          POSTGRES_DB: edunomad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunomad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare + seed database (incl. staff fixtures)
        run: |
          npx prisma db push --skip-generate
          node prisma/harden.mjs
          npm run db:seed
          node prisma/seed-catalog.mjs
          node prisma/seed-team.mjs
          node prisma/seed-ops.mjs
          node prisma/seed-sop.mjs
      - run: NODE_ENV=production npm run build
      - name: Run E2E suite
        # Advisory: a brand-new account routes through onboarding and some
        # selectors need a deployed-staging baseline (G186 AC2), so this reports
        # rather than gates. What it used to be the only check for is now covered
        # by blocking jobs: RBAC and journey logic by the unit/integration suite,
        # and WCAG A/AA by the a11y step in build-test, which scans 52 routes
        # including the authenticated consoles rather than the four public pages
        # e2e/a11y.spec.ts covers.
        continue-on-error: true
        run: npm run test:e2e

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repo for committed secrets
        run: bash scripts/check-secrets.sh
