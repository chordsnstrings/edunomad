name: Backup

on:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC — full backup
    - cron: "0 3 * * 0"   # Sunday 03:00 UTC — restore test
  workflow_dispatch:

jobs:
  daily-backup:
    name: Daily Postgres backup
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Run backup
        run: bash scripts/backup.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}

  weekly-restore-test:
    name: Weekly restore test (staging)
    if: github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-latest
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edunomad
          POSTGRES_PASSWORD: edunomad
          POSTGRES_DB: restore_scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunomad"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest backup into scratch DB
        run: bash scripts/restore-test.sh
        env:
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          RESTORE_DATABASE_URL: postgresql://edunomad:edunomad@localhost:5432/restore_scratch
